<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cluvr</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍀</text></svg>">
    <link rel="stylesheet" href="css/chat.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<div class="backtotheclublist">
    <button onclick="goBackToMyClubs()"> ← </button>
</div>
<div class="container">
    <h2 id="clubNameHeader">클럽명</h2>
    <!-- 채팅방 목록 및 생성 버튼 제거 -->
</div>
<!-- 숨김 input (쿼리스트링 값 저장용) - 보안상 sessionStorage 사용 권장 -->
<input type="hidden" id="clubId">
<input type="hidden" id="userId">
<!-- 토큰은 sessionStorage에서 관리하므로 hidden input 제거 -->
<!-- 채팅 영역 -->
<hr class="divider">
<div class="chat-layout">
    <div class="chat-container">
        <div class="chat-header">
            💬 - <span id="currentRoomName">채팅방을 선택해주세요</span>
            <button id="openMembersBtn" title="채팅 멤버 보기" aria-label="채팅 멤버 보기">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05C17.16 14.1 19 15.03 19 16.5V19h5v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            </button>
        </div>
        <div id="chatBox"></div>
        <div class="message-input-container">
            <input type="text" id="messageInput" placeholder="메시지를 입력하세요" disabled>
            <button class="send-btn" onclick="sendMessage()" disabled id="sendBtn">📤</button>
        </div>
        <!-- 오버레이 멤버 패널 (chat-container 내부에 위치) -->
        <div id="membersOverlay">
            <div class="members-header">
                <span>👥 Member (<span id="memberCount">0</span>)</span>
                <button id="closeMembersBtn" title="닫기" aria-label="닫기">✕</button>
            </div>
            <hr class="divider">
            <div class="members-list" id="membersList"></div>
        </div>
    </div>
</div>
<script src="js/chat-local.js"></script>
<script>
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const clubName = urlParams.get('clubName');
    if (clubName) {
        document.getElementById('clubNameHeader').textContent = decodeURIComponent(clubName);
    }
    const roomId = urlParams.get('roomId');
    if (!roomId) {
        alert('채팅방을 선택해주세요.');
        window.location.href = `chatroomlist.html?${window.location.search.replace(/^\?/, '')}`;
    }
}
function goBackToMyClubs() {
    const urlParams = new URLSearchParams(window.location.search);
    const clubId = urlParams.get('clubId');
    const token = getToken() || urlParams.get('token');
    const clubName = urlParams.get('clubName');
    window.location.href = `chatroomlist.html?clubId=${clubId}&token=${encodeURIComponent(token)}&clubName=${encodeURIComponent(clubName)}`;
}
</script>
</body>
</html>
